  const [markets, setMarkets] = useState(savedConfig.markets || ['RU', 'BR', 'US']);

  const [hijab, setHijab] = useState(false);

    const url = URL.createObjectURL(f);
    setUploadedImg(url);
  };

    const perImage = 1; // 1 credit / image
    return markets.length * scenes.length * Math.ceil(count / Math.max(markets.length * scenes.length, 1)) * perImage;

    arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];

    onGenerate(config);

              </div>
            )}

// ============== Page: Generating ==============

function GeneratingPage({ config, onDone }) {
  const steps = [
    { name: '识别产品主体', icon: '🔍', t: 800 },
    { name: '智能抠图', icon: '✂️', t: 600 },
    { name: '生成俄罗斯市场素材(斯拉夫女模)', icon: '🇷🇺', t: 1500 },
    { name: '生成巴西市场素材(拉美女模)', icon: '🇧🇷', t: 1500 },
    { name: '生成美国市场素材(白底专业图)', icon: '🇺🇸', t: 1200 },
    { name: '5 国语言文案翻译 + SEO 关键词', icon: '🌐', t: 900 },
    { name: '适配各平台尺寸(速卖通/Temu/Amazon)', icon: '📐', t: 700 },
    { name: '打包入库', icon: '📦', t: 400 }
  ];

  const [idx, setIdx] = useState(0);
  const [done, setDone] = useState([]);

  useEffect(() => {
    if (idx >= steps.length) {
      setTimeout(onDone, 600);
      return;
    }
    const t = setTimeout(() => {
      setDone(d => [...d, idx]);
      setIdx(i => i + 1);
    }, steps[idx].t);
    return () => clearTimeout(t);
  }, [idx]);

  const progress = (done.length / steps.length) * 100;

  return (
    <div className="max-w-3xl mx-auto px-6 py-12">
      <div className="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
        <div className="flex items-center gap-3 mb-6">
          <div className="w-10 h-10 rounded-lg bg-indigo-100 flex items-center justify-center text-xl animate-pulse">⚡</div>
          <div>
            <h2 className="text-lg font-semibold">正在生成中...</h2>
            <p className="text-xs text-slate-500">{config.productName} · {config.markets.length} 市场 · {config.count} 张图</p>
          </div>
        </div>

        <div className="h-2 bg-slate-100 rounded-full overflow-hidden mb-6">
          <div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" style={{ width: progress + '%' }} />
        </div>

        <div className="space-y-2">
          {steps.map((s, i) => {
            const isDone = done.includes(i);
            const isActive = i === idx;
            return (
              <div key={i} className={cls(
                'flex items-center gap-3 p-2.5 rounded-lg transition',
                isActive && 'bg-indigo-50',
                isDone && 'opacity-70'
              )}>
                <div className="w-7 h-7 flex items-center justify-center text-sm">
                  {isDone ? <span className="text-emerald-600">✓</span> : isActive ? <span className="animate-spin">⟳</span> : <span className="text-slate-300">○</span>}
                </div>
                <div className="text-lg">{s.icon}</div>
                <div className={cls('text-sm flex-1', isActive ? 'text-slate-900 font-medium' : 'text-slate-600')}>{s.name}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ============== Page: Result ==============

function ResultPage({ config, onBack, onSave }) {
  const [tab, setTab] = useState('images');

  // generate mock images grouped by market+scene

    return config.markets.map(mc => {
      const m = MARKETS.find(x => x.code === mc);
      const scenesData = config.scenes.map(sid => {
        const s = SCENES.find(x => x.id === sid);
        return {
          id: `${mc}-${sid}`,
          scene: s,
          imgs: config.platforms.slice(0, 2).map((p, i) => ({
            platform: PLATFORMS.find(x => x.id === p),
            url: placeholderImg(`${config.productName}-${mc}-${sid}-${i}`, 600, 600)
          }))
        };
      });
      return { market: m, scenes: scenesData };
    });
  }, [config]);

  const totalImgs = groups.reduce((sum, g) => sum + g.scenes.reduce((s, sc) => s + sc.imgs.length, 0), 0);

  return (
    <div className="max-w-7xl mx-auto px-6 py-6">
      {/* Header */}
      <div className="flex items-center gap-4 mb-6">
        <button onClick={onBack} className="text-slate-500 hover:text-slate-800 text-sm">← 返回控制台</button>

        </div>
        <button onClick={onSave} className="px-3 py-1.5 text-sm border border-slate-200 rounded-md hover:bg-slate-50">保存到历史</button>

      {/* Tabs */}
      <div className="flex gap-1 mb-6 border-b border-slate-200">
        {[
          { id: 'images', name: '图片素材', count: totalImgs },
          { id: 'copy', name: '多语言文案', count: config.markets.length },
          { id: 'keywords', name: 'SEO 关键词', count: config.markets.length },

              'px-4 py-2.5 text-sm border-b-2 -mb-px transition',
              tab === t.id ? 'border-indigo-600 text-indigo-700 font-medium' : 'border-transparent text-slate-600 hover:text-slate-900'

          </button>
        ))}
      </div>

      {/* Tab content */}
      {tab === 'images' && (
        <div className="space-y-8 fade-in">
          {groups.map(g => (
            <div key={g.market.code}>
              <div className="flex items-center gap-3 mb-3">
                <span className="text-2xl">{g.market.flag}</span>
                <h3 className="font-medium text-lg">{g.market.name}市场</h3>
                <span className="text-sm text-slate-500">模特: {g.market.model}</span>
                <button className="ml-auto text-xs text-indigo-600 hover:underline">下载本市场全部 →</button>
              </div>
              <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                {g.scenes.flatMap(sc => sc.imgs.map((img, i) => (
                  <div key={`${sc.id}-${i}`} className="group relative bg-slate-100 rounded-lg overflow-hidden aspect-square">
                    <img src={img.url} className="w-full h-full object-cover" alt="" loading="lazy" />

                      <div className="opacity-0 group-hover:opacity-100 transition text-white text-xs font-medium">
                        {sc.scene.name}
                      </div>
                      <div className="opacity-0 group-hover:opacity-100 transition text-white/80 text-[10px]">
                        {img.platform.name} · {img.platform.size}

                    </div>

                      {sc.scene.name}

            </div>

        <div className="grid md:grid-cols-2 gap-4 fade-in">

          })}
        </div>
      )}

      {tab === 'platform' && (
        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4 fade-in">
          {config.platforms.map(pid => {
            const p = PLATFORMS.find(x => x.id === pid);
            const sample = placeholderImg(`${config.productName}-${pid}`, 400, 400);
            return (
              <div key={pid} className="bg-white border border-slate-200 rounded-xl p-5">
                <div className="flex items-center gap-2 mb-3">
                  <span className="font-medium">{p.name}</span>
                  <span className="text-xs text-slate-500">{p.size}</span>
                  <button className="ml-auto text-xs text-indigo-600 hover:underline">导出 →</button>
                </div>
                <img src={sample} className="w-full aspect-square object-cover rounded-lg mb-3" />
                <div className="text-xs text-slate-500 leading-relaxed">
                  自动生成 {config.markets.length * config.scenes.length} 张已适配 {p.name}({p.size})尺寸的素材。
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============== Root ==============

function App() {
  const [page, setPage] = useState('console'); // console | generating | result | history | pricing
  const [config, setConfig] = useState({});
  const [savedConfig, setSavedConfig] = useState({});
  const [history, setHistory] = useState([]);
  const [credits, setCredits] = useState(180);

  const goGenerate = (cfg) => {
    setConfig(cfg);
    setPage('generating');
  };

  const onGenerateDone = () => {
    setCredits(c => Math.max(0, c - (config.count || 0)));
    setPage('result');
  };

  const saveToHistory = () => {
    const item = {
      id: 't-' + Date.now(),
      productName: config.productName,
      markets: config.markets,
      count: config.count,
      createdAt: new Date().toLocaleString('zh-CN'),
      cover: config.uploadedImg || placeholderImg('saved-' + Date.now())
    };
    setHistory(h => [item, ...h]);
    setPage('history');
  };

  return (
    <div>
      <NavBar page={page === 'generating' || page === 'result' ? 'console' : page} setPage={(p) => setPage(p)} credits={credits} />
      {page === 'console' && <ConsolePage onGenerate={goGenerate} savedConfig={savedConfig} setSavedConfig={setSavedConfig} />}
      {page === 'generating' && <GeneratingPage config={config} onDone={onGenerateDone} />}
      {page === 'result' && <ResultPage config={config} onBack={() => setPage('console')} onSave={saveToHistory} />}
      {page === 'history' && <HistoryPage history={history} onOpen={() => setPage('result')} />}
      {page === 'pricing' && <PricingPage />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
